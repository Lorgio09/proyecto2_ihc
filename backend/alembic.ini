# Configuración genérica para una sola base de datos.

[alembic]
# Ruta a los scripts de migración.
# Normalmente es una ruta en formato POSIX (con barras /),
# relativa al token %(here)s, que indica la ubicación de este
# archivo ini.
script_location = %(here)s/migrations

# Plantilla para generar los nombres de los archivos de migración; por defecto es %%(rev)s_%%(slug)s
# Descomenta la línea de abajo si quieres que los archivos empiecen con la fecha y la hora.
# Consulta https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# para ver todos los tokens disponibles.
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
# O se pueden organizar en subcarpetas por fecha (requiere recursive_version_locations = true)
# file_template = %%(year)d/%%(month).2d/%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(rev)s_%%(slug)s

# Ruta que se agrega al inicio de sys.path, si está definida.
# Por defecto es el directorio de trabajo actual. Para varias rutas, el separador
# se define en "path_separator", más abajo.
prepend_sys_path = .


# Zona horaria que se usa para escribir la fecha dentro del archivo de migración
# y en su nombre.
# Si se especifica, requiere la librería tzdata, que se instala agregando
# `alembic[tz]` a las dependencias de pip.
# El valor de texto se pasa a ZoneInfo().
# Déjalo vacío para usar la hora local.
# timezone =

# Cantidad máxima de caracteres del campo "slug"
# truncate_slug_length = 40

# Pon 'true' para ejecutar el entorno durante
# el comando 'revision', aunque no se use autogenerate.
# revision_environment = false

# Pon 'true' para que los archivos .pyc y .pyo sin
# su archivo .py de origen se detecten como revisiones en la
# carpeta versions/.
# sourceless = false

# Ubicación de las versiones; por defecto es
# <script_location>/versions. Si se usan varias carpetas de
# versiones, las revisiones iniciales deben indicarse con --version-path.
# El separador de rutas que se use aquí debe ser el indicado en "path_separator",
# más abajo.
# version_locations = %(here)s/bar:%(here)s/bat:%(here)s/alembic/versions

# path_separator: indica qué carácter separa las listas de rutas de archivos,
# incluidas version_locations y prepend_sys_path, en archivos de configparser
# como alembic.ini.
# El valor que se escribe por defecto en los alembic.ini nuevos es "os", que usa
# os.pathsep para separar las rutas según el sistema operativo.
#
# Para mantener compatibilidad con alembic.ini antiguos, este valor por defecto NO
# se aplica si path_separator no está en alembic.ini. Si esta opción se omite
# por completo, se usa este comportamiento alternativo:
#
# 1. La opción version_locations usa la clave antigua "version_path_separator";
#    si tampoco existe, se separa por espacios y/o comas, como en versiones
#    anteriores.
# 2. La opción prepend_sys_path se separa por espacios, comas o dos puntos,
#    como en versiones anteriores.
#
# Los valores válidos de path_separator son:
#
# path_separator = :
# path_separator = ;
# path_separator = space
# path_separator = newline
#
# Usa os.pathsep. Es la configuración por defecto para proyectos nuevos.
path_separator = os

# Pon 'true' para buscar los archivos de origen de forma recursiva
# en cada carpeta de "version_locations".
# Disponible desde la versión 1.10 de Alembic.
# recursive_version_locations = false

# Codificación de salida que se usa al escribir los archivos
# de revisión a partir de script.py.mako.
# output_encoding = utf-8

# URL de la base de datos. Solo la usa el script env.py mantenido por el proyecto.
# Otras formas de configurar la URL de la base de datos se pueden personalizar en
# el archivo env.py.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# post_write_hooks define scripts o funciones de Python que se ejecutan
# sobre los scripts de revisión recién generados. Consulta la documentación
# para más detalles y ejemplos.

# Formatear con "black": usa el ejecutor console_scripts con el entrypoint "black"
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# Revisar con "ruff" intentando corregir: usa el ejecutor module con el módulo "ruff"
# hooks = ruff
# ruff.type = module
# ruff.module = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# Como alternativa, usa el ejecutor exec para correr un binario que esté en el PATH
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# Configuración del logging. También la usa solo el script env.py
# mantenido por el proyecto.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
