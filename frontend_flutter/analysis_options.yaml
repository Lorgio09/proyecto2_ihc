# Este archivo configura el analizador, que revisa el código Dart de forma
# estática para encontrar errores, advertencias y lints.
#
# Los problemas que encuentra el analizador se muestran en los IDE compatibles
# con Dart (https://dart.dev/tools#ides-and-editors). El analizador también se
# puede ejecutar desde la línea de comandos con `flutter analyze`.

# La siguiente línea activa un conjunto de lints recomendados para apps,
# paquetes y plugins de Flutter, pensados para fomentar buenas prácticas.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - web/**
    - macos/**
    - linux/**
    - ios/**
    - windows/**

linter:
  # Las reglas de lint de este proyecto se pueden ajustar en la sección de
  # abajo, para desactivar reglas de `package:flutter_lints/flutter.yaml`
  # (incluido arriba) o para activar reglas adicionales. La lista de todos los
  # lints disponibles y su documentación está en https://dart.dev/lints.
  #
  # En lugar de desactivar una regla para todo el proyecto en la sección de
  # abajo, también se puede silenciar en una sola línea de código o en un
  # archivo Dart concreto con la sintaxis `// ignore: name_of_lint` y
  # `// ignore_for_file: name_of_lint` en la línea o el archivo que produce
  # el lint.
  rules:
    # avoid_print: false  # Quitar el comentario para desactivar `avoid_print`
    # prefer_single_quotes: true  # Quitar el comentario para activar `prefer_single_quotes`

# Más información sobre este archivo en
# https://dart.dev/guides/language/analysis-options
