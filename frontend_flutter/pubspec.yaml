name: frontend_flutter
description: "A new Flutter project."
# La siguiente línea evita que el paquete se publique por accidente en
# pub.dev con `flutter pub publish`. Es lo recomendado para paquetes privados.
publish_to: 'none' # Quitar esta línea si se quiere publicar en pub.dev

# Lo siguiente define la versión y el número de compilación de la aplicación.
# Una versión son tres números separados por puntos, como 1.2.43,
# seguidos de un número de compilación opcional separado por un +.
# Tanto la versión como el número de compilación se pueden sobrescribir en
# flutter build con --build-name y --build-number, respectivamente.
# En Android, build-name se usa como versionName y build-number como
# versionCode. Más sobre el versionado en Android en
# https://developer.android.com/studio/publish/versioning
# En iOS, build-name se usa como CFBundleShortVersionString y build-number
# como CFBundleVersion. Más sobre el versionado en iOS en
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# En Windows, build-name se usa como las partes mayor, menor y parche de las
# versiones del producto y del archivo, y build-number como sufijo de
# compilación.
version: 1.0.0+1

environment:
  sdk: ^3.13.0

# Las dependencias indican otros paquetes que este paquete necesita para
# funcionar. Para actualizarlas automáticamente a sus últimas versiones,
# se puede ejecutar `flutter pub upgrade --major-versions`. También se pueden
# actualizar a mano cambiando los números de versión de abajo por la última
# versión disponible en pub.dev. Para ver qué dependencias tienen versiones
# más nuevas, ejecutar `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Lo siguiente agrega la fuente Cupertino Icons a la aplicación.
  # Se usa con la clase CupertinoIcons para íconos con estilo de iOS.
  cupertino_icons: ^1.0.8

  # paquete para hacer peticiones HTTP al backend
  http: ^1.2.2
  flutter_secure_storage: ^11.2.0
  # descarga de "Mis datos" en la versión web
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # El paquete "flutter_lints" de abajo trae un conjunto de lints recomendados
  # para fomentar buenas prácticas. Ese conjunto se activa en el archivo
  # `analysis_options.yaml`, en la raíz del paquete. Ver ese archivo para
  # saber cómo desactivar reglas de lint concretas o activar otras.
  flutter_lints: ^6.0.0

# Para información sobre la parte genérica de Dart de este archivo, ver
# la siguiente página: https://dart.dev/tools/pub/pubspec

# La siguiente sección es específica de los paquetes de Flutter.
flutter:

  # La siguiente línea asegura que la fuente Material Icons se incluya
  # en la aplicación, para poder usar los íconos de la clase Icons
  # de Material.
  uses-material-design: true

  # Para agregar recursos (assets) a la aplicación, se usa una sección assets:
  assets:
    - assets/icons/

  # Un recurso de imagen puede tener una o más "variantes" según la
  # resolución; ver https://flutter.dev/to/resolution-aware-images

  # Para agregar recursos que vienen de dependencias, ver
  # https://flutter.dev/to/asset-from-package

  # Para agregar fuentes propias a la aplicación, se añade aquí una sección
  # fonts, dentro de esta sección "flutter". Cada entrada de la lista debe
  # tener una clave "family" con el nombre de la familia y una clave "fonts"
  # con una lista del archivo y otros datos de la fuente. Por
  # ejemplo:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # Para fuentes que vienen de dependencias,
  # ver https://flutter.dev/to/font-from-package
