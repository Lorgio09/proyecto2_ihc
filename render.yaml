# Blueprint de Render: la API de UniSport. Su base de datos PostgreSQL está en Neon.
# Render lee este archivo cuando se conecta el fork (New > Blueprint).
# La app web (Flutter) se publica por separado en GitHub Pages; ver
# .github/workflows/web.yml.
services:
  - type: web
    name: unisport-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # En cada arranque: aplica las migraciones y agrega los datos de demostración que falten
    # (seed.py solo inserta lo que no existe) y luego levanta la API.
    startCommand: alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      # PostgreSQL en Neon (gratis y no vence): su cadena de conexión
      # (directa, sin pooling) se pega a mano en Render y nunca se sube al repositorio.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Google Analytics 4 (Tarea 9). Se completan a mano en Render y nunca se
      # suben al repositorio: déjalas vacías para no enviar eventos a GA.
      - key: GA_MEASUREMENT_ID
        sync: false
      - key: GA_API_SECRET
        sync: false
