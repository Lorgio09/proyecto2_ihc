# Render Blueprint: the UniSport API and its PostgreSQL database.
# Render reads this file when the fork is connected (New > Blueprint).
# The web app (Flutter) is published separately to GitHub Pages; see
# .github/workflows/web.yml.
services:
  - type: web
    name: unisport-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Every start: apply migrations and add the demo data that is missing
    # (seed.py only inserts what is not there), then serve the API.
    startCommand: alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DATABASE_URL
        fromDatabase:
          name: unisport-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Google Analytics 4 (Tarea 9). Filled in by hand in Render, never
      # committed: leave them empty to disable sending events to GA.
      - key: GA_MEASUREMENT_ID
        sync: false
      - key: GA_API_SECRET
        sync: false

databases:
  - name: unisport-db
    plan: free
    region: oregon
    databaseName: unisport
    user: unisport
